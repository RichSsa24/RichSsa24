name: Generate Snake

on:
  # se regenera sola cada 12 horas
  schedule:
    - cron: "0 */12 * * *"
  # permite correrla a mano desde la pestaña Actions
  workflow_dispatch:
  # y cada vez que hagas push a main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#0e7490&color_dots=#ebedf0,#a5f3fc,#67e8ff,#22d3ee,#0891b2
            dist/snake-dark.svg?color_snake=#fbbf24&color_dots=#161b22,#164e63,#0e7490,#22d3ee,#67e8ff

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
